worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Docker's embedded DNS server. Using a variable (see `set $upstream_*`
    # below) instead of a static `upstream {}` block forces Nginx to
    # re-resolve the service name on each request, which is what lets
    # `docker compose up --scale backend=4` actually get round-robin
    # traffic across all backend replicas without an Nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Rate limiting is enforced by the backend itself (Redis-backed,
    # correct across replicas). Nginx here focuses purely on routing. ----

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;

        # ---- API routes -> backend ----
        location /api/ {
            set $backend_upstream backend:4000;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Health check -> backend ----
        location = /health {
            set $backend_upstream backend:4000;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---- Frontend SPA routes -> frontend container ----
        # These top-level paths are reserved for the React app (see
        # server/src/services/url.service.ts RESERVED_ALIASES, which
        # blocks the same names from ever being issued as short codes).
        location ~ ^/(login|register|dashboard|create|analytics)(/.*)?$ {
            set $frontend_upstream frontend:80;
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
        }

        location = / {
            set $frontend_upstream frontend:80;
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
        }

        # Frontend build assets (JS/CSS/etc).
        location /assets/ {
            set $frontend_upstream frontend:80;
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
        }

        # ---- Everything else is treated as a short code redirect ----
        # e.g. GET /abc1234 -> backend resolves and 302-redirects.
        location / {
            set $backend_upstream backend:4000;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Don't follow the redirect on Nginx's behalf - pass the
            # 302 straight back to the browser.
            proxy_redirect off;
        }
    }
}
